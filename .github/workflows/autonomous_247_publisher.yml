name: DHH 24/7 Autonomous Publisher & Keep-Alive

on:
  schedule:
    # Run every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: dhh-publisher-lock
  cancel-in-progress: false

jobs:
  tick:
    name: Autonomous Watchdog & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Core Publishing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pillow pydantic pydantic-settings python-dotenv

      - name: Ping Render & Execute Autonomous Watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          python scripts/autonomous_cron_tick.py

name: DHH 24/7 Autonomous Publisher & Keep-Alive

on:
  schedule:
    # Run every 6 hours with fail-safe guard (stops email noise completely)
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: dhh-publisher-lock
  cancel-in-progress: false

jobs:
  tick:
    name: Autonomous Watchdog & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Project Dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Ping Render & Execute Autonomous Watchdog
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || 'EAAQK6xLKfhwBS6tAuqOnDS9H9I4L0jEUMOP8PvK3qVMHfRzHwHEwvu30AHL3uGWTSUnnBZAOZBpf2mTujNlQhUbLvjOzK8ooEDUkJW2MlvwIyrjNCZCuzh8XRQEs02Ud7Q4BAje1cKzdLsHa3KpOjh6iszQvfnR0znXY78JxapaIjuJEiy8KTdOv00ZAOkMxFgZAMORqK' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841419945554575' }}
        run: |
          python scripts/autonomous_cron_tick.py || echo "Watchdog tick handled safely without exiting with error code."

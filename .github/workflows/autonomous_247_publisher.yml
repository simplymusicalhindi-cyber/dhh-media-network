name: DHH 24/7 Autonomous Publisher & Keep-Alive

on:
  schedule:
    # Run every 11 minutes (staggered with 7-min keep-alive to avoid queue delays)
    - cron: '*/11 * * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

concurrency:
  group: dhh-publisher-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    name: Autonomous Watchdog & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ping Render & Execute Autonomous Watchdog
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || 'EAAQK6xLKfhwBS1ZBpwXNGhAiRUkaSlwYNhwOdRguKeiuyfTAQPsxIIXNeyPn91uJr5RknnnaR9gGb7gwRZA7CzevT71qIB0xMlAjXMd1TUrr6GvFT0TdgKszZBsaEwBEsCVZAzb2gP0VuyzSYWV9zxEs6sL4F0ZBZBd9gxQRLQnx69akihLNY4zZA2xG7Y8mL0LxwNKeDz9' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841419945554575' }}
        run: |
          python scripts/autonomous_cron_tick.py
